name: Update star maps

on:
  schedule:
    - cron: "17 4 * * 1" # weekly, Mondays 04:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "stargazer_map/**"
      - "pyproject.toml"
      - ".github/workflows/update-maps.yml"

permissions:
  contents: write 
  pages: write
  id-token: write

concurrency:
  group: star-maps
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install .

      # data/ lives on its own `data` branch, written only by this workflow, so the
      # weekly refresh never commits to main. A fork without that branch starts fresh.
      - name: Check out previous data
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch --depth 1 origin data:data; then
            git worktree add data data
          else
            git worktree add --orphan -b data data
          fi

      - name: Fetch stargazers and geocode locations
        env:
          # GitHub only lets admins/collaborators list stargazers (since July 2026),
          # so the default GITHUB_TOKEN is not enough. See README > "Token".
          GH_TOKEN: ${{ secrets.STARGAZERS_TOKEN }}
          ORG: ${{ github.repository_owner }} 
          INCLUDE_FORKS: "false"
          INCLUDE_ARCHIVED: "true"
          INCLUDE_LOGINS: "false"
          MAX_GEOCODE: "800"
        run: stargazer-map fetch

      - name: Commit refreshed data
        working-directory: data
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit --quiet -m "chore: refresh star maps $(date -u +%F)"
            git push origin HEAD:data
          fi

      - name: Build site
        env:
          # Map layers shown when a page opens: countries, bubbles, or both.
          # Viewers can toggle each one on the map.
          MAP_LAYERS: "countries,bubbles"
          # Repos with fewer stars get no page or card (their stargazers still count on
          # the overview map). prism-oncology lists only repos with 10+ stars.
          MIN_STARS: ${{ github.repository_owner == 'prism-oncology' && '10' || '0' }}
          # Image file shown at the top of every page instead of the owner's GitHub
          # avatar. prism-oncology uses its logo from branding/.
          LOGO: ${{ github.repository_owner == 'prism-oncology' && 'branding/prism-oncology.jpeg' || '' }}
        run: stargazer-map build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
